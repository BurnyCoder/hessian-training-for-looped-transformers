[project]
name = "looped-hessian"
version = "0.1.0"
description = "Hessian-trace regularization (exact Hutchinson penalty and NSO) for looped transformers: does penalizing curvature improve length generalization?"
readme = "README.md"
authors = [
    { name = "Libor \"Burny\" Burian" }
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
looped-hessian = "looped_hessian.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# PyTorch CUDA wheels come from the official PyTorch index, as documented in
# https://docs.astral.sh/uv/guides/integration/pytorch/ . cu132 is the index that
# ships torch 2.15.0 Windows wheels with sm_120 (RTX 50xx / Blackwell) kernels.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
testpaths = ["tests"]
